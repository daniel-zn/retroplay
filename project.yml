name: RetroPlay
options:
  bundleIdPrefix: com.danielzn
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  RetroPlayPackage:
    path: App

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  RetroPlay:
    type: application
    platform: iOS
    sources:
      - path: AppIcon.icon
      - path: AppHost/Sources
      - path: AppHost/Supporting
        buildPhase: resources
        excludes:
          - RetroPlay-Bridging-Header.h
          - Info.plist
          - RetroPlayPPSSPPBridge.h
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielzn.retroplay
        PRODUCT_NAME: RetroPlay
        INFOPLIST_FILE: AppHost/Supporting/Info.plist
        GENERATE_INFOPLIST_FILE: false
        SWIFT_OBJC_BRIDGING_HEADER: AppHost/Supporting/RetroPlay-Bridging-Header.h
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) RETROPLAY_HAS_MGBA RETROPLAY_HAS_PPSSPP"
        CLANG_CXX_LANGUAGE_STANDARD: "c++20"
        CLANG_ENABLE_MODULES: "YES"
        ENABLE_PREVIEWS: false
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/App/Vendor/Output"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/AppHost/Sources $(SRCROOT)/../ppsspp $(SRCROOT)/../ppsspp/Common $(SRCROOT)/../ppsspp/Core $(SRCROOT)/../ppsspp/GPU $(SRCROOT)/../ppsspp/ext/libzip $(SRCROOT)/../ppsspp/ext"
        USER_HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../ppsspp"
        # Expose mCoreFind / mCoreLoadFile / save helpers from mgba/core/core.h
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) ENABLE_VFS=1 ENABLE_DIRECTORIES=1 RETROPLAY_HAS_PPSSPP=1 RETROPLAY_HAS_MGBA=1"
        OTHER_LDFLAGS: "$(inherited) -lc++ -ObjC -lz"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG RETROPLAY_HAS_MGBA RETROPLAY_HAS_PPSSPP"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "RETROPLAY_HAS_MGBA RETROPLAY_HAS_PPSSPP"
    dependencies:
      - package: RetroPlayPackage
        product: RetroPlayCore
      - package: RetroPlayPackage
        product: RetroPlayApp
      - framework: App/Vendor/Output/mGBA.xcframework
        embed: false
      - framework: App/Vendor/Output/PPSSPP.xcframework
        embed: false
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: OpenAL.framework
      - sdk: OpenGLES.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: VideoToolbox.framework
      - sdk: GameController.framework
      - sdk: Accelerate.framework
      - sdk: CoreServices.framework
      - sdk: CoreText.framework
      - sdk: MobileCoreServices.framework
      - sdk: UniformTypeIdentifiers.framework
    scheme:
      testTargets: []
      gatherCoverageData: false
